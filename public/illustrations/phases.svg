<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 604" width="420" height="604" font-family="Inter, DejaVu Sans, sans-serif"><text data-claude-text-id="titre" x="24" y="28" font-size="15" font-weight="600" fill="#1d1d1b">On avance sur critère, pas à date fixe</text><g data-claude-anchor="phase-1"><rect x="24" y="46" width="372" height="88" rx="8" fill="none" stroke="#9b9b94" stroke-width="1.2"/><text data-claude-text-id="p1-nom" x="40" y="72" font-size="15" font-weight="600" fill="#1d1d1b">1 · Apprentissage</text><text data-claude-text-id="p1-semaines" x="380" y="72" font-size="12.5" text-anchor="end" fill="#6f6f6a">semaines 1 à 4</text><text data-claude-text-id="p1-l1" x="40" y="98" font-size="13" fill="#1d1d1b">Routine complète 5 à 7 j/7 + micro-séances</text><text data-claude-text-id="p1-l2" x="40" y="118" font-size="13" fill="#1d1d1b">Poids du corps, la technique d’abord</text></g><g data-claude-anchor="critere-1"><path d="M48 134 L48 196" fill="none" stroke="#9b9b94" stroke-width="1.2"/><path d="M48 154 L59 165 L48 176 L37 165 Z" fill="#c8642a" stroke="#c8642a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill-opacity="0.1"/><text data-claude-text-id="g1-l1" x="72" y="162" font-size="13" font-weight="600" fill="#1d1d1b">Passe si : Y-T-W et cobra sans cambrer</text><text data-claude-text-id="g1-l2" x="72" y="180" font-size="13" font-weight="600" fill="#1d1d1b">ni hausser les épaules, sans douleur</text></g><g data-claude-anchor="phase-2"><rect x="24" y="196" width="372" height="88" rx="8" fill="none" stroke="#9b9b94" stroke-width="1.2"/><text data-claude-text-id="p2-nom" x="40" y="222" font-size="15" font-weight="600" fill="#1d1d1b">2 · Renforcement</text><text data-claude-text-id="p2-semaines" x="380" y="222" font-size="12.5" text-anchor="end" fill="#6f6f6a">semaines 5 à 12</text><text data-claude-text-id="p2-l1" x="40" y="248" font-size="13" fill="#1d1d1b">12 répétitions, puis 5 s de tenue, puis 0,5 kg</text><text data-claude-text-id="p2-l2" x="40" y="268" font-size="13" fill="#1d1d1b">Version courte possible 2 jours par semaine</text></g><g data-claude-anchor="critere-2"><path d="M48 284 L48 346" fill="none" stroke="#9b9b94" stroke-width="1.2"/><path d="M48 304 L59 315 L48 326 L37 315 Z" fill="#c8642a" stroke="#c8642a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill-opacity="0.1"/><text data-claude-text-id="g2-l1" x="72" y="312" font-size="13" font-weight="600" fill="#1d1d1b">Passe si : Y-T-W 2 × 12 par lettre, 5 s, 0,5 kg</text><text data-claude-text-id="g2-l2" x="72" y="330" font-size="13" font-weight="600" fill="#1d1d1b">et cobra 2 × 10 bras tendus en Y</text></g><g data-claude-anchor="phase-3"><rect x="24" y="346" width="372" height="88" rx="8" fill="none" stroke="#9b9b94" stroke-width="1.2"/><text data-claude-text-id="p3-nom" x="40" y="372" font-size="15" font-weight="600" fill="#1d1d1b">3 · Intégration</text><text data-claude-text-id="p3-semaines" x="380" y="372" font-size="12.5" text-anchor="end" fill="#6f6f6a">semaines 13 à 24</text><text data-claude-text-id="p3-l1" x="40" y="398" font-size="13" fill="#1d1d1b">Routine 5 j/7 avec les variantes difficiles</text><text data-claude-text-id="p3-l2" x="40" y="418" font-size="13" fill="#1d1d1b">Micro-séances maintenues au bureau</text></g><g data-claude-anchor="critere-3"><path d="M48 434 L48 496" fill="none" stroke="#9b9b94" stroke-width="1.2"/><path d="M48 454 L59 465 L48 476 L37 465 Z" fill="#c8642a" stroke="#c8642a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill-opacity="0.1"/><text data-claude-text-id="g3-l1" x="72" y="462" font-size="13" font-weight="600" fill="#1d1d1b">Passe si : posture redressée tenue sans</text><text data-claude-text-id="g3-l2" x="72" y="480" font-size="13" font-weight="600" fill="#1d1d1b">y penser, assis comme en marchant</text></g><g data-claude-anchor="phase-4"><rect x="24" y="496" width="372" height="88" rx="8" fill="none" stroke="#9b9b94" stroke-width="1.2" stroke-dasharray="5 4"/><text data-claude-text-id="p4-nom" x="40" y="522" font-size="15" font-weight="600" fill="#1d1d1b">4 · Entretien</text><text data-claude-text-id="p4-semaines" x="380" y="522" font-size="12.5" text-anchor="end" fill="#6f6f6a">après 6 mois</text><text data-claude-text-id="p4-l1" x="40" y="548" font-size="13" fill="#1d1d1b">Version courte 3 à 4 fois par semaine</text><text data-claude-text-id="p4-l2" x="40" y="568" font-size="13" fill="#1d1d1b">Si le dos s’arrondit : retour en phase 2</text></g></svg>